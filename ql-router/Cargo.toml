[package]
name = "ql-router"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[[bin]]
name = "ql-router"
path = "src/main.rs"
required-features = ["tokio"]

[[test]]
name = "tcp"
required-features = ["tokio"]

[dependencies]
anyhow.workspace = true
bytes = "1"
dashmap.workspace = true
figment.workspace = true
futures-lite = "2.6"
getrandom = "0.2"
hex.workspace = true
ql-codec.workspace = true
ql-common.workspace = true
ql-wire.workspace = true
serde.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
